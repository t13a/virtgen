name: main

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t virtgen src

      # The render goes into an empty directory, so every file is validated, and it must match the
      # provisioners and the index that are committed.
      - name: Render the example registry
        run: |
          mkdir "$RUNNER_TEMP/provisioners"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/example/registry:/src/registry" \
            -v "$RUNNER_TEMP/provisioners:/src/provisioners" \
            virtgen
          diff -r "$RUNNER_TEMP/provisioners" example/provisioners
          git diff --exit-code

      # The end-to-end test runs for a tag, before the image is published, and when the workflow is
      # run by hand. It creates VMs on a libvirt of the runner.
      - name: Set up libvirt
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          test -e /dev/kvm
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvirt-daemon-system qemu-system-x86 qemu-utils ovmf dnsmasq-base xorriso sshpass
          sudo usermod -aG libvirt "$USER"
          # The libvirt of the runner cannot load the AppArmor profiles of VMs, so they run without them.
          echo 'security_driver = "none"' | sudo tee -a /etc/libvirt/qemu.conf >/dev/null
          sudo systemctl restart libvirtd
          if ! sudo virsh pool-info default >/dev/null 2>&1; then
            sudo virsh pool-define-as default dir --target /var/lib/libvirt/images
          fi
          if ! sudo virsh pool-info default | grep '^State: *running' >/dev/null; then sudo virsh pool-start default; fi
          if ! sudo virsh net-info default | grep '^Active: *yes' >/dev/null; then sudo virsh net-start default; fi

      # sg gives the step the group libvirt, which the user joined after the step began.
      - name: Test end to end
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: sg libvirt -c "make -C tests E2E_RUN='docker run --rm --user $(id -u):$(id -g)'"

      - name: Log in to the Container registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A version tag such as v0.1.0 gives the image 0.1.0, and latest by the default flavor latest=auto.
      - name: Extract Docker metadata
        if: startsWith(github.ref, 'refs/tags/v')
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}}

      # The image was tested above, and this build reuses its cache.
      - name: Build and push the image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: ./src
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
